<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="sky" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="0.55" stop-color="#071426"/>
      <stop offset="1" stop-color="#0a0f18"/>
    </linearGradient>
    <linearGradient id="tower" x1="0" x2="1">
      <stop offset="0" stop-color="#102033"/>
      <stop offset="1" stop-color="#1b344b"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <g opacity=".38">
    <path d="M0 640 C260 600 390 680 650 620 S1050 600 1600 640 V900 H0Z" fill="#0a1927"/>
    <path d="M0 700 C300 660 500 735 820 682 S1210 670 1600 705 V900 H0Z" fill="#08111b"/>
  </g>
  <g id="city-back" opacity=".72">
    <rect x="70" y="420" width="70" height="270" fill="url(#tower)"/>
    <rect x="190" y="320" width="100" height="370" fill="url(#tower)"/>
    <rect x="355" y="380" width="86" height="310" fill="url(#tower)"/>
    <rect x="520" y="260" width="120" height="430" fill="url(#tower)"/>
    <rect x="730" y="350" width="88" height="340" fill="url(#tower)"/>
    <rect x="910" y="285" width="130" height="405" fill="url(#tower)"/>
    <rect x="1120" y="395" width="92" height="295" fill="url(#tower)"/>
    <rect x="1305" y="305" width="130" height="385" fill="url(#tower)"/>
  </g>
  <g id="city-front">
    <rect x="20" y="560" width="180" height="220" fill="#0f1f2c"/>
    <rect x="240" y="470" width="180" height="310" fill="#11283a"/>
    <rect x="465" y="540" width="240" height="240" fill="#0f2335"/>
    <rect x="760" y="430" width="220" height="350" fill="#122a3c"/>
    <rect x="1025" y="520" width="170" height="260" fill="#0e2133"/>
    <rect x="1245" y="455" width="310" height="325" fill="#11283a"/>
  </g>
  <g id="windows" filter="url(#glow)">
    <g fill="#35d9ff">
      <rect x="92" y="448" width="12" height="4"/><rect x="210" y="360" width="16" height="5"/><rect x="555" y="300" width="18" height="5"/>
      <rect x="946" y="330" width="18" height="5"/><rect x="1350" y="345" width="20" height="5"/><rect x="800" y="470" width="18" height="5"/>
      <rect x="130" y="610" width="18" height="5"/><rect x="294" y="520" width="18" height="5"/><rect x="560" y="590" width="22" height="5"/>
      <rect x="1090" y="575" width="18" height="5"/><rect x="1330" y="510" width="22" height="5"/><rect x="1480" y="610" width="18" height="5"/>
    </g>
    <g fill="#ff9d2e">
      <rect x="255" y="575" width="14" height="5"/><rect x="610" y="480" width="16" height="5"/><rect x="880" y="535" width="18" height="5"/>
      <rect x="1180" y="630" width="18" height="5"/><rect x="1410" y="555" width="18" height="5"/>
    </g>
  </g>
  <g id="scan-beams" opacity=".75" filter="url(#glow)">
    <path d="M170 190 L330 780" stroke="#21d9ff" stroke-width="3" opacity=".45"/>
    <path d="M1320 160 L1160 780" stroke="#ff9d2e" stroke-width="3" opacity=".42"/>
    <path d="M805 120 L805 780" stroke="#5b8cff" stroke-width="2" opacity=".35"/>
  </g>
  <g id="panels" filter="url(#glow)">
    <rect x="260" y="210" width="120" height="54" rx="8" fill="none" stroke="#35d9ff" stroke-width="2" opacity=".85"/>
    <path d="M278 232 H360 M278 247 H330" stroke="#35d9ff" stroke-width="2"/>
    <rect x="1110" y="220" width="150" height="64" rx="8" fill="none" stroke="#ff9d2e" stroke-width="2" opacity=".8"/>
    <path d="M1130 243 H1235 M1130 260 H1190" stroke="#ff9d2e" stroke-width="2"/>
  </g>
  <g id="fog" opacity=".22">
    <ellipse cx="320" cy="760" rx="360" ry="60" fill="#8bdfff"/>
    <ellipse cx="1020" cy="800" rx="560" ry="70" fill="#8bdfff"/>
  </g>
</svg>
